name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TODO: no Windows legs. suite-setup.sh adds PGBIN (C:/...) to PATH, whose
# colon splits it, and tests.roc has never run on Windows.
jobs:
  # The release gate: roc check, roc test, the bundle sanity check and
  # ./tests.roc under the flake's compiler. tests.roc boots a throwaway
  # Postgres from the dev shell.
  #
  # No examples here or in the legs below. They connect to a Postgres server
  # on localhost:5432, and tests.roc checks them instead.
  test:
    name: Required
    uses: niclas-ahden/roc-workflows/.github/workflows/test.yml@v3
    with:
      examples: ''
      # WORKAROUND: the expect blocks build at dev, since an optimized build
      # of the parser needs more memory than the runner has. Back to speed
      # once compiler optimizations reduce its memory footprint.
      test-opt: dev
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  roc-versions:
    name: 'Optional: look up Roc versions'
    uses: niclas-ahden/roc-workflows/.github/workflows/resolve-versions.yml@v3

  # The newest downloaded nightly on every operating system, because that is
  # the compiler a user of the package has. suite-setup.sh puts initdb and
  # pg_ctl on the PATH for ./tests.roc.
  latest-roc:
    name: 'Optional: latest Roc'
    needs: roc-versions
    uses: niclas-ahden/roc-workflows/.github/workflows/suite.yml@v3
    with:
      os: '["ubuntu-24.04", "macos-15"]'
      roc: ${{ needs.roc-versions.outputs.nightly }}
      label: Tests
      examples: ''
      setup: .github/scripts/suite-setup.sh
      opts: '["speed", "dev", "size", "interpreter"]'
